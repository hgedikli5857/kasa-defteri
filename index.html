<meta name="description" content="Gelir, gider, banka hesapları, cariler, vadeler ve nakit akışı tek yerde.">
<meta name="theme-color" content="#2B47D4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1120" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<body>
<div id="loginRoot" hidden></div>
<div id="appRoot" hidden>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h1><span class="mark">₺</span>Kasa Defteri</h1><div class="chips" id="chips"></div></div>
        <div class="netpos"><small>Net pozisyon</small><b id="netpos" class="num">—</b>
          <button class="btn eye" id="privBtn" type="button" aria-pressed="false" aria-label="Verileri gizle" title="Verileri gizle"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="btn primary" id="addBtn" type="button">+ Yeni kayıt</button></div>
      </div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </div>
  </header>
  <div class="wrap" id="noticeBox"></div>
  <main class="wrap" id="view"></main>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<noscript><p style="padding:16px">Kasa Defteri'ni kullanmak için JavaScript'i aç.</p></noscript>
<script type="module" src="app.js"></script>
